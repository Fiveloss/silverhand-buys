name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Offline checks (standard library only)
        run: python tests.py
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Invariant checks again, with the tests that need the requirements
        run: python tests.py
      - name: Telegram layer against a fake Bot API
        run: python tests_bot.py
