<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silverhand Buys</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Glass tiles (Bento) over a living green aurora, with data running along a grid behind. */
  :root {
    --page: #04070a; --text: #eef6f2; --dim: rgba(238,246,242,.55); --faint: rgba(238,246,242,.32);
    --accent: #2df59a; --deep: #0b8f5c; --ink: #03120b; --buy: #2df59a; --sell: #ff6b88; --amber: #ffc861;
    --tile: rgba(255,255,255,.055); --tile-line: rgba(255,255,255,.1); --line: rgba(255,255,255,.07);
    --sans: Sora, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  html, body { margin: 0; color: var(--text); font: 14px/1.4 var(--sans); font-feature-settings: "tnum"; }
  body { background: transparent; padding: 14px 14px calc(96px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }

  #fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(64px); opacity: .5; animation: drift 14s ease-in-out infinite alternate; }
  .b1 { width: 340px; height: 340px; background: #0fd88a; top: -150px; left: -100px; }
  .b2 { width: 260px; height: 260px; background: #0a7d6a; top: 38%; right: -120px; animation-delay: -5s; }
  .b3 { width: 300px; height: 300px; background: #16a36b; bottom: -160px; left: 20px; opacity: .3; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(28px, 36px) scale(1.08); } }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .45; }
  header, main, #msg { position: relative; z-index: 1; }

  .tile { background: var(--tile); border: 1px solid var(--tile-line); border-radius: 20px; padding: 12px; position: relative; overflow: hidden;
          backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
          animation: rise .45s var(--ease) both; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
  .glow { background: radial-gradient(70% 80% at 85% 0%, rgba(45,245,154,.22), transparent 70%), var(--tile); }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 40px; }
  .av { width: 36px; height: 36px; flex: none; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--deep));
        display: grid; place-items: center; font-weight: 800; color: var(--ink); box-shadow: 0 0 18px rgba(45,245,154,.35); }
  .ttl { flex: 1; min-width: 0; }
  .ttl b { display: block; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ttl b.brand { letter-spacing: .08em; font-size: 15px; }
  .ttl small { display: block; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: flex; padding: 3px; border-radius: 12px; background: var(--tile); border: 1px solid var(--tile-line); flex: none; }
  .seg button { background: none; border: 0; padding: 5px 10px; border-radius: 9px; font: 600 11px var(--sans); color: var(--dim); cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font: 600 10.5px/16px var(--sans);
          border: 1px solid var(--tile-line); background: var(--tile); color: var(--text); white-space: nowrap; }
  .pill.g { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(45,245,154,.6); animation: ping 1.8s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(45,245,154,0); } 100% { box-shadow: 0 0 0 0 rgba(45,245,154,0); } }

  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 72px; gap: 8px; margin-bottom: 8px; }
  .s4 { grid-column: span 4; } .s2 { grid-column: span 2; } .r2 { grid-row: span 2; } .r3 { grid-row: span 3; }
  .k { font: 600 10px var(--sans); color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
  .v { font: 700 21px/1.1 var(--mono); margin-top: 6px; white-space: nowrap; }
  .v small { font-size: 11px; color: var(--dim); font-weight: 500; }
  .mc { font: 800 38px/1 var(--sans); letter-spacing: -.02em; margin-top: 8px; background: linear-gradient(180deg, #fff, #8ff7c8);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
  .g { color: var(--buy); } .r { color: var(--sell); } .a { color: var(--amber); } .d { color: var(--dim); }
  .chg { font: 700 12px var(--mono); }
  .spark { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; }
  .gauge { display: grid; place-items: center; }
  .press { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 14px; background: var(--sell); }
  .press i { display: block; background: var(--buy); box-shadow: 0 0 10px var(--buy); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; font: 500 12px var(--mono); border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .card { margin-bottom: 8px; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 2px 8px; }
  .sec b { font: 700 13px var(--sans); letter-spacing: .02em; }

  /* home */
  .hello { padding: 16px; }
  .hello h1 { margin: 8px 0 2px; font: 800 24px/1.15 var(--sans); }
  .counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .counter { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .counter b { display: block; font: 700 19px/1.1 var(--mono); margin-top: 4px; }
  .tok { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 12px; }
  .tok .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tok .s { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tok .m { text-align: right; flex: none; }
  .tok .m b { display: block; font: 700 14px var(--mono); }
  .mini { width: 70px; height: 32px; flex: none; }
  .feed .row { animation: slide .5s var(--ease) both; }
  @keyframes slide { from { transform: translateX(-10px); } to { transform: none; } }  /* never hidden: no opacity */
  .side { font: 800 10px var(--mono); padding: 3px 0; width: 38px; text-align: center; border-radius: 6px; flex: none; }
  .side.b { background: rgba(45,245,154,.14); color: var(--buy); } .side.s { background: rgba(255,107,136,.14); color: var(--sell); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .act { display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; border: 1px solid var(--tile-line); border-radius: 16px;
         background: var(--tile); color: var(--text); font: 600 13px var(--sans); text-align: left; }
  .act i { font-style: normal; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: rgba(45,245,154,.12); flex: none; font-size: 16px; }
  .act small { display: block; color: var(--dim); font-weight: 500; font-size: 11px; }

  /* scan */
  .radar { width: 160px; height: 160px; margin: 18px auto 10px; border-radius: 50%; position: relative;
           background: repeating-radial-gradient(circle, rgba(45,245,154,.10) 0 1px, transparent 1px 26px), rgba(0,0,0,.25);
           border: 1px solid rgba(45,245,154,.25); overflow: hidden; }
  .radar::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
           background: conic-gradient(from 0deg, rgba(45,245,154,.55), rgba(45,245,154,0) 25%, transparent);
           animation: sweep 1.6s linear infinite; }
  .radar::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .blip { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; animation: blip 1.6s infinite; }
  @keyframes blip { 10% { opacity: 1; } 60% { opacity: 0; } }
  .signals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sig { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; font: 600 11px var(--sans); background: rgba(0,0,0,.25); border: 1px solid var(--line); }
  .sig i { width: 8px; height: 8px; border-radius: 50%; }
  .sig.ok i { background: var(--buy); box-shadow: 0 0 8px var(--buy); } .sig.warn i { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .sig.bad i { background: var(--sell); box-shadow: 0 0 8px var(--sell); } .sig.na i { background: var(--faint); }
  .hbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 5px; }
  .hbar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--deep), var(--accent)); animation: grow .8s var(--ease) both; transform-origin: left; }
  .hbar.red i { background: linear-gradient(90deg, #a3304a, var(--sell)); } .hbar.amb i { background: linear-gradient(90deg, #9c6d16, var(--amber)); }
  @keyframes grow { from { transform: scaleX(0); } }
  .holder { padding: 6px 0; border-top: 1px solid var(--line); font: 500 12px var(--mono); }
  .holder:first-of-type { border-top: 0; }
  .tag { font: 700 9.5px var(--sans); padding: 2px 6px; border-radius: 5px; background: rgba(255,200,97,.15); color: var(--amber); margin-left: 6px; }

  /* info */
  .steps { position: relative; padding-left: 8px; }
  .step { display: flex; gap: 12px; padding: 8px 0; position: relative; }
  .step .n { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 800 13px var(--mono);
             color: var(--ink); background: var(--accent); box-shadow: 0 0 16px rgba(45,245,154,.5); position: relative; z-index: 1; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 14px; top: 38px; bottom: -6px; width: 2px;
             background: linear-gradient(var(--accent), rgba(45,245,154,.1)); }
  .step b { display: block; font-size: 13.5px; } .step small { color: var(--dim); font-size: 12px; }
  .cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cmd { padding: 10px; border: 1px solid var(--tile-line); border-radius: 14px; background: rgba(0,0,0,.2); cursor: pointer; text-align: left; color: var(--text); font: inherit; }
  .cmd code { display: block; font: 700 12px var(--mono); color: var(--accent); margin-bottom: 3px; }
  .cmd span { font-size: 11.5px; color: var(--dim); }
  details.tile summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  details.tile summary::-webkit-details-marker { display: none; }
  details.tile summary::after { content: "+"; color: var(--accent); font: 700 18px var(--mono); }
  details.tile[open] summary::after { content: "–"; }

  label.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  label.set:first-of-type { border-top: 0; }
  label.set small { display: block; color: var(--dim); font-size: 11.5px; }
  input[type=number], input[type=text], select { width: 110px; background: rgba(0,0,0,.25); color: var(--text); border: 1px solid var(--tile-line);
        border-radius: 10px; padding: 8px 9px; font: 14px var(--mono); text-align: right; }
  input.wide { width: 100%; text-align: left; font-size: 12.5px; }
  select { text-align: left; font-family: var(--sans); }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: rgba(255,255,255,.12); border-radius: 13px; transition: background .2s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%;
        background: var(--text); transition: transform .25s var(--ease); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); background: var(--ink); }
  .segc { display: flex; background: rgba(0,0,0,.25); border: 1px solid var(--tile-line); border-radius: 10px; overflow: hidden; }
  .segc button { background: none; border: 0; color: var(--dim); font: 600 11.5px var(--sans); padding: 7px 10px; }
  .segc button.on { background: var(--accent); color: var(--ink); }
  .btn { display: block; width: 100%; text-align: center; padding: 11px; border-radius: 14px; background: var(--tile);
         border: 1px solid var(--tile-line); color: var(--text); font: 600 14px var(--sans); cursor: pointer; }
  .btn.lime { background: var(--accent); color: var(--ink); border-color: var(--accent); box-shadow: 0 0 20px rgba(45,245,154,.35); }
  .btn.ghost { background: none; color: var(--sell); border-color: rgba(255,107,136,.4); }
  .btn:disabled { opacity: .5; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .inline { display: flex; gap: 8px; margin-top: 10px; }
  .inline .btn { width: auto; padding: 9px 16px; flex: none; }
  .answer { margin-top: 10px; padding: 10px 12px; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px;
            font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer:empty { display: none; }
  .answer a { color: var(--accent); }
  .answer code, .answer pre { font-family: var(--mono); font-size: 12px; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .style { border: 2px solid var(--tile-line); border-radius: 14px; overflow: hidden; cursor: pointer; background: rgba(0,0,0,.25); }
  .style.on { border-color: var(--accent); box-shadow: 0 0 18px rgba(45,245,154,.35); }
  .style video { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #000; }
  .style div { padding: 6px 8px; font: 600 12px var(--sans); }
  .empty { padding: 26px 14px; text-align: center; color: var(--dim); font-size: 13px; }
  #toast { position: fixed; z-index: 3; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
           background: rgba(19,21,22,.95); border: 1px solid var(--tile-line); padding: 9px 14px; border-radius: 12px; font: 600 12.5px var(--sans);
           transition: opacity .25s, transform .25s var(--ease); pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  nav { position: fixed; z-index: 2; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; gap: 2px; padding: 5px; border-radius: 999px; background: rgba(19,21,22,.88); border: 1px solid var(--tile-line);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  nav button { background: none; border: 0; padding: 9px 13px; border-radius: 999px; font: 600 12px var(--sans); color: var(--dim); cursor: pointer; }
  nav button.on { background: var(--accent); color: var(--ink); box-shadow: 0 0 20px rgba(45,245,154,.5); }
  .note { color: var(--dim); font-size: 13px; text-align: center; margin: 24px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="fx"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><canvas id="bg"></canvas></div>
<header id="head"></header>
<main id="view"></main>
<p id="msg" class="note">Loading…</p>
<div id="toast"></div>
<nav id="nav" class="hidden">
  <button data-tab="home" class="on">Home</button><button data-tab="scan">Scan</button><button data-tab="promo">Promo</button>
  <button data-tab="info">Info</button><button data-tab="owner" class="hidden">Admin</button>
</nav>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
};
const svg = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const view = $("#view"), head = $("#head");
let info = null, lastToken = "", home = null, refresh = null;

// ---------- formatting
function usd(x, approx) {
  if (x == null || isNaN(x)) return "—";
  const a = Math.abs(x), p = approx ? "≈$" : "$";
  if (a >= 1e9) return p + (x / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return p + (x / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return p + (x / 1e3).toFixed(1) + "K";
  if (a >= 100) return p + Math.round(x).toLocaleString("en-US");
  return p + x.toFixed(2);
}
function money(q, t) { return t.rate ? usd(q * t.rate, t.approx) : (+q).toPrecision(4) + " " + t.quote_symbol; }
function short(q, t) { return t.rate ? usd(q * t.rate, t.approx) : (+q).toPrecision(3); }
function pct(x) { return (x >= 0 ? "▲ " : "▼ ") + Math.abs(x * 100).toFixed(x * 100 >= 1000 ? 0 : 1) + "%"; }
function share(x) { return x == null ? "—" : x < 0.0001 ? "<0.01%" : (x * 100).toFixed(x < 0.1 ? 2 : 1) + "%"; }
function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  return s < 60 ? Math.round(s) + "s" : s < 3600 ? Math.round(s / 60) + "m" : s < 86400 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d";
}
function countUp(el, to, fmt) {   // a number rising to its value, eased (0.9 s)
  const t0 = performance.now(), from = 0;
  const tick = (t) => { const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(from + (to - from) * e); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
const ALLOWED = new Set(["B", "STRONG", "I", "EM", "U", "S", "CODE", "PRE", "A", "BR", "BLOCKQUOTE", "TG-EMOJI"]);
function botHtml(html) {   // the bot's answers are Telegram HTML: keep its few tags, drop the rest
  const doc = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html");
  const walk = (node) => {
    const out = document.createDocumentFragment();
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out.append(n.textContent); continue; }
      if (n.nodeType !== 1) continue;
      if (!ALLOWED.has(n.tagName)) { out.append(walk(n)); continue; }
      const e = document.createElement(n.tagName === "TG-EMOJI" ? "span" : n.tagName.toLowerCase());
      if (n.tagName === "A") {
        const href = n.getAttribute("href") || "";
        if (/^https:\/\//.test(href)) { e.href = href; e.target = "_blank"; e.onclick = (ev) => { if (tg) { ev.preventDefault(); /^https:\/\/t\.me\//.test(href) ? tg.openTelegramLink(href) : tg.openLink(href); } }; }
      }
      e.append(walk(n));
      out.append(e);
    }
    return out;
  };
  const box = h("div", { class: "answer" });
  box.append(walk(doc.body.firstChild));
  return box;
}

async function api(path, body) {
  const r = await fetch("api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "X-Init-Data": tg ? tg.initData : "", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.json();
}
function say(text) { const m = $("#msg"); m.textContent = text || ""; m.classList.toggle("hidden", !text); }
function haptic(kind) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); }
let toastT = 0;
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }
function copy(text, what) {
  const done = () => { toast("Copied: " + what); haptic("success"); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => toast(text)); else toast(text);
}
function brandHead(sub, right) {
  head.replaceChildren(h("div", { class: "av" }, "S"),
    h("div", { class: "ttl" }, h("b", { class: "brand" }, "SILVERHAND BUYS"), h("small", {}, sub || (info && info.network) || "Silverhand Buys")),
    right || h("span", { class: "pill g" }, "TESTNET"));
}
function openBot(q) { return () => tg ? tg.openTelegramLink("https://t.me/" + info.username + "?" + q) : null; }

// ---------- tabs
let tab = "home", current = null, saved = null;
function go(name) {
  tab = name;
  clearInterval(refresh);
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  if (tg) { tg.MainButton.hide(); tg.BackButton.hide(); }
  current = null;
  window.scrollTo(0, 0);
  ({ home: showHome, scan: showScan, promo: showPromo, info: showInfo, owner: showOwner }[name])()
    .catch((e) => say("Could not load: " + e.message));
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => go(b.dataset.tab)));

function spark(t) {   // the market cap over the chosen window, from the kept trades
  const span = { "1h": 3600, "24h": 86400, "7d": 7 * 86400 }[tf];
  const now = Date.now() / 1000;
  const pts = (t.series || []).filter((p) => p[0] >= now - span);
  const box = h("div", { class: "spark" });
  if (pts.length < 2) return box;
  const W = 360, H = 104, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = (x) => 4 + (x - x0) / Math.max(1, x1 - x0) * (W - 10), Y = (y) => 8 + (y1 - y) / Math.max(1e-12, y1 - y0) * (H - 14);
  const line = pts.map((p) => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ");
  const lx = X(pts[pts.length - 1][0]), ly = Y(pts[pts.length - 1][1]);
  box.append(svg(`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2df59a" stop-opacity=".35"/><stop offset="1" stop-color="#2df59a" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${line} ${X(x1)},${H} ${X(x0)},${H}" fill="url(#sg)"/>
    <polyline points="${line}" fill="none" stroke="#2df59a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="3.5" fill="#2df59a"/></svg>`));
  return box;
}

function ring(p, big, small, size = 116, color = "url(#gg)") {
  const off = 301.6 * (1 - Math.max(0, Math.min(1, p || 0)));
  return svg(`<svg width="${size}" height="${size}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#0b8f5c"/><stop offset="1" stop-color="#2df59a"/></linearGradient></defs>
    <circle cx="60" cy="60" r="48" stroke="rgba(255,255,255,.08)" stroke-width="10" fill="none"/>
    <circle cx="60" cy="60" r="48" stroke="${color}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="${off}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px rgba(45,245,154,.6))"/>
    <text x="60" y="58" text-anchor="middle" fill="#eef6f2" font-family="JetBrains Mono, monospace" font-weight="700" font-size="${String(big).length > 6 ? 15 : 20}">${big}</text>
    <text x="60" y="76" text-anchor="middle" fill="rgba(238,246,242,.55)" font-family="Sora, sans-serif" font-weight="600" font-size="9" letter-spacing="1">${small}</text></svg>`);
}

// ---------- the moving grid, after the bot's intro card: nodes with pulsing cores and data running
// along the grid in turns like snakes; paused while the app is hidden, still for reduced motion.
const Grid = (function () {
  const cv = document.getElementById("bg"), cx = cv.getContext("2d"), G = 28;
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, cols = 0, rows = 0, nodes = [], snakes = [], last = 0, on = false;
  const rnd = (n) => Math.floor(Math.random() * n), a = (x) => `rgba(45,245,154,${x})`;
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / G); rows = Math.ceil(H / G);
    nodes = Array.from({ length: Math.max(6, Math.round(cols * rows / 45)) }, () => ({ x: (1 + rnd(cols - 1)) * G, y: (1 + rnd(rows - 1)) * G, ph: Math.random() * 6.28 }));
    snakes = Array.from({ length: Math.max(5, Math.round(W * H / 30000)) }, spawn);
    for (let i = 0; i < 100; i++) snakes.forEach((s) => step(s, .05));
  }
  function spawn() {
    const hz = Math.random() < .5;
    return { x: rnd(cols) * G, y: rnd(rows) * G, dx: hz ? (Math.random() < .5 ? 1 : -1) : 0, dy: hz ? 0 : (Math.random() < .5 ? 1 : -1),
             trail: [], speed: 70 + Math.random() * 60, run: 2 + rnd(6), left: 0, life: 40 + rnd(60) };
  }
  function step(s, dt) {
    s.left += s.speed * dt;
    while (s.left >= G / 2) {
      s.left -= G / 2; s.trail.unshift([s.x, s.y]); if (s.trail.length > 16) s.trail.pop();
      s.x += s.dx * G / 2; s.y += s.dy * G / 2;
      if (s.x % G === 0 && s.y % G === 0 && --s.run <= 0) { const t = Math.random() < .5 ? 1 : -1; [s.dx, s.dy] = s.dx ? [0, t] : [t, 0]; s.run = 2 + rnd(6); }
      if (--s.life <= 0 || s.x < -G || s.y < -G || s.x > W + G || s.y > H + G) Object.assign(s, spawn());
    }
  }
  function draw(t) {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = a(.12);
    for (let x = G; x < W; x += G) for (let y = G; y < H; y += G) cx.fillRect(x - 1, y - 1, 2, 2);
    for (const n of nodes) {
      const p = .5 + .5 * Math.sin(t / 700 + n.ph);
      cx.strokeStyle = a(.25); cx.lineWidth = 1; cx.strokeRect(n.x - 7.5, n.y - 7.5, 15, 15);
      cx.fillStyle = a(.15 + .35 * p); cx.fillRect(n.x - 3.5, n.y - 3.5, 7, 7);
    }
    for (const s of snakes) [[s.x, s.y], ...s.trail].forEach(([x, y], i, all) => {
      const r = i ? 2 : 3; cx.fillStyle = a((1 - i / all.length) * .6); cx.fillRect(x - r, y - r, 2 * r, 2 * r);
    });
  }
  function frame(t) {
    if (!on) return;
    const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    if (!document.hidden) { snakes.forEach((s) => step(s, dt)); draw(t); }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { if (on) size(); });
  return { start() { if (on) return; on = true; size(); if (still) { draw(0); on = false; } else { last = 0; requestAnimationFrame(frame); } } };
})();
